spring:
  application:
    name: torrent-worker
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:torrent}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false

server:
  port: 8082

grpc:
  server:
    port: 9090

torrent:
  worker:
    id: ${HOSTNAME:localhost}-${random.uuid}
    thread-pool:
      core-size: 10
      max-size: 50
      queue-capacity: 100
    heartbeat-interval-ms: 5000
    job-timeout-check-interval-ms: 10000
