syntax = "proto3";

package dev.torrent.grpc;

option java_multiple_files = true;
option java_package = "dev.torrent.grpc";
option java_outer_classname = "JobExecutionProto";

service JobExecutionService {
    rpc ExecuteJob (JobExecutionRequest) returns (JobExecutionResponse);
}

message JobExecutionRequest {
    string job_id = 1;
}

message JobExecutionResponse {
    bool success = 1;
    string message = 2;
}
