version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: torrent-postgres
    restart: always
    environment:
      POSTGRES_DB: torrent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 128M

  redis:
    image: redis:7-alpine
    container_name: torrent-redis
    restart: always
    ports:
      - "6379:6379"
    deploy:
      resources:
        limits:
          memory: 64M

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: torrent-zookeeper
    restart: always
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      KAFKA_HEAP_OPTS: "-Xmx128M -Xms64M"
    deploy:
      resources:
        limits:
          memory: 150M

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: torrent-kafka
    restart: always
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_HEAP_OPTS: "-Xmx256M -Xms128M"
    deploy:
      resources:
        limits:
          memory: 300M

  torrent-api:
    build: 
      context: .
      dockerfile: Dockerfile.api
    container_name: torrent-api
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - kafka
      - redis
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/torrent
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_REDIS_HOST: redis
      JAVA_TOOL_OPTIONS: "-Xmx128m -Xms64m"
    deploy:
      resources:
        limits:
          memory: 200M

  torrent-scheduler:
    build:
      context: .
      dockerfile: Dockerfile.scheduler
    container_name: torrent-scheduler
    restart: always
    depends_on:
      - postgres
      - kafka
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/torrent
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JAVA_TOOL_OPTIONS: "-Xmx128m -Xms64m"
    deploy:
      resources:
        limits:
          memory: 200M

  torrent-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: torrent-worker
    restart: always
    depends_on:
      - postgres
      - kafka
      - redis
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/torrent
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_REDIS_HOST: redis
      JAVA_TOOL_OPTIONS: "-Xmx128m -Xms64m"
    deploy:
      resources:
        limits:
          memory: 200M

volumes:
  postgres_data:
